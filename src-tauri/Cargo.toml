[package]
name = "lapis-desktop"
version = "0.1.0"
edition = "2024"
rust-version = "1.99"
license = "Apache-2.0"
publish = false
default-run = "lapis-desktop"

[features]
default = []
custom-protocol = ["tauri/custom-protocol"]
e2e = ["dep:tauri-plugin-wdio", "dep:tauri-plugin-wdio-webdriver", "dep:tempfile"]

[dependencies]
async-trait = "0.1"
tempfile = { version = "=3.27.0", optional = true }
tokio = { version = "1", features = ["rt", "sync"] }
tauri-plugin-jj-store = { path = "../../jj-store/crates/tauri-plugin-jj-store", version = "0.1.0", features = ["tauri"] }

jj-store-jj = { path = "../../jj-store/crates/jj-store-jj", version = "0.1.0", default-features = false, features = ["companion"] }
jj-store-model = { path = "../../jj-store/crates/jj-store-model", version = "0.1.0" }
jj-store-conversations = { path = "../../jj-store/crates/jj-store-conversations", version = "0.1.0", features = ["native-privacy", "store-capture"] }
jj-store-core = { path = "../../jj-store/crates/jj-store-core", version = "0.1.0" }
jj-collab = { path = "../../jj-store/crates/jj-collab", version = "0.1.0" }
jj-store-git = { path = "../../jj-store/crates/jj-store-git", version = "0.1.0" }

cap-std = "=4.0.3"
cap-tempfile = "=4.0.3"
libc = "0.2"
mime_guess = "=2.0.5"
notify = "=8.2.0"
percent-encoding = "2"
rustix = { version = "=1.1.5", features = ["fs"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "=0.10.9"
tauri = { version = "=2.12.4", features = ["devtools"] }
tauri-plugin-clipboard-manager = "=2.5.0"
tauri-plugin-deep-link = "=2.6.2"
tauri-plugin-dialog = "=2.7.1"
tauri-plugin-opener = "=2.5.4"
tauri-plugin-single-instance = "=2.4.2"
tauri-plugin-window-state = "=2.5.0"
tauri-plugin-wdio = { version = "=1.5.0", optional = true }
tauri-plugin-wdio-webdriver = { version = "=1.5.0", optional = true }
turso = { version = "=0.7.2", default-features = false, features = ["fts"] }
url = "2"
uuid = { version = "1", features = ["v4", "serde"] }

tauri-plugin-lapis-terminal = { path = "../../lapis-terminal/crates/tauri-plugin-lapis-terminal" }

tauri-plugin-lapis-ai = { path = "../../lapis-ai/crates/tauri-plugin-lapis-ai" }

[target.'cfg(target_os = "macos")'.dependencies]
mac-usernotifications = { version = "=0.3.1", default-features = false }
objc2 = "=0.6.5"
block2 = "=0.6.2"
objc2-app-kit = { version = "=0.3.2", default-features = false, features = ["NSWindow", "NSView", "NSButton", "NSWorkspace"] }
objc2-foundation = { version = "=0.3.2", default-features = false, features = ["NSGeometry", "NSNotification", "NSOperation", "NSString", "NSArray", "NSURL", "NSFileManager", "NSError", "block2"] }

[build-dependencies]
tauri-build = { version = "=2.7.3", features = [] }

[dev-dependencies]
tempfile = "=3.27.0"
jj-agent = { path = "../../jj-store/crates/jj-agent", version = "0.1.0" }

[profile.dev]
debug = 0

[profile.test]
debug = 0

[[bin]]
name = "lapis-acp-native-fixture"
path = "tests/fixtures/acp-provider.rs"
required-features = ["e2e"]
