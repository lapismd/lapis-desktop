[package]
name = "lapis-desktop"
version = "0.1.0"
edition = "2024"
rust-version = "1.99"
license = "Apache-2.0"
publish = false

[features]
default = []
custom-protocol = ["tauri/custom-protocol"]
e2e = ["dep:tauri-plugin-wdio", "dep:tauri-plugin-wdio-webdriver"]

[dependencies]
cap-std = "=4.0.3"
cap-tempfile = "=4.0.3"
libc = "0.2"
mime_guess = "=2.0.5"
notify = "=8.2.0"
percent-encoding = "2"
rustix = { version = "=1.1.5", features = ["fs"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tauri = { version = "=2.12.4", features = [] }
tauri-plugin-dialog = "=2.7.1"
tauri-plugin-window-state = "=2.5.0"
tauri-plugin-wdio = { version = "=1.5.0", optional = true }
tauri-plugin-wdio-webdriver = { version = "=1.5.0", optional = true }
turso = { version = "=0.7.2", default-features = false, features = ["fts"] }
url = "2"
uuid = { version = "1", features = ["v4", "serde"] }

[target.'cfg(target_os = "macos")'.dependencies]
objc2 = "=0.6.5"
block2 = "=0.6.2"
objc2-app-kit = { version = "=0.3.2", default-features = false, features = ["NSWindow", "NSView", "NSButton"] }
objc2-foundation = { version = "=0.3.2", default-features = false, features = ["NSGeometry", "NSNotification", "NSOperation", "NSString", "block2"] }

[build-dependencies]
tauri-build = { version = "=2.7.3", features = [] }

[dev-dependencies]
tempfile = "=3.27.0"

[profile.dev]
debug = 0

[profile.test]
debug = 0
