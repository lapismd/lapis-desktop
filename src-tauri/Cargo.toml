[package]
name = "lapis-desktop"
version = "0.1.0"
edition = "2024"
rust-version = "1.99"
license = "Apache-2.0"
publish = false
default-run = "lapis-desktop"

[features]
default = []
custom-protocol = ["tauri/custom-protocol"]
e2e = ["dep:tauri-plugin-wdio", "dep:tauri-plugin-wdio-webdriver"]

[dependencies]
lapis-app-protocol = { git = "https://github.com/lapismd/lapis-server", rev = "4150cac6f2fef28b128421e4e3a851b848acdcf3", version = "0.1.0" }
lapis-app-core = { git = "https://github.com/lapismd/lapis-server", rev = "4150cac6f2fef28b128421e4e3a851b848acdcf3", version = "0.1.0" }
jj-forge = { git = "https://github.com/stevejuma/jj-store", rev = "7a98bd89d2bc77fb6ec41f91186992abb19ba161", version = "0.1.0" }
jj-vault = { git = "https://github.com/stevejuma/jj-store", rev = "7a98bd89d2bc77fb6ec41f91186992abb19ba161", version = "0.1.0" }
async-trait = "0.1"
tempfile = "=3.27.0"
tokio = { version = "1", features = ["rt", "rt-multi-thread", "sync", "net", "io-util", "io-std", "time", "macros"] }
tauri-plugin-jj-store = { git = "https://github.com/stevejuma/jj-store", rev = "7a98bd89d2bc77fb6ec41f91186992abb19ba161", version = "0.1.0", features = ["tauri"] }

jj-store-jj = { git = "https://github.com/stevejuma/jj-store", rev = "7a98bd89d2bc77fb6ec41f91186992abb19ba161", version = "0.1.0", default-features = false, features = ["companion"] }
jj-store-service = { git = "https://github.com/stevejuma/jj-store", rev = "7a98bd89d2bc77fb6ec41f91186992abb19ba161", version = "0.1.0" }
jj-store-model = { git = "https://github.com/stevejuma/jj-store", rev = "7a98bd89d2bc77fb6ec41f91186992abb19ba161", version = "0.1.0" }
lapis-ai-capture = { git = "https://github.com/lapismd/lapis-ai", tag = "v0.2.0", version = "0.2.0", features = ["opencode-sqlite"] }
jj-store-capture = { git = "https://github.com/stevejuma/jj-store", rev = "7a98bd89d2bc77fb6ec41f91186992abb19ba161", version = "0.1.0", default-features = false }
chrono = { version = "0.4", default-features = false, features = ["std"] }
jj-agent = { git = "https://github.com/stevejuma/jj-store", rev = "7a98bd89d2bc77fb6ec41f91186992abb19ba161", version = "0.1.0" }

cap-std = "=4.0.3"
cap-tempfile = "=4.0.3"
libc = "0.2"
mime_guess = "=2.0.5"
notify = "=8.2.0"
percent-encoding = "2"
rustix = { version = "=1.1.5", features = ["fs", "process"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "=0.10.9"
tauri = { version = "=2.12.4", features = ["devtools"] }
tauri-plugin-clipboard-manager = "=2.5.0"
tauri-plugin-deep-link = "=2.6.2"
tauri-plugin-dialog = "=2.7.1"
tauri-plugin-opener = "=2.5.4"
tauri-plugin-single-instance = "=2.4.2"
tauri-plugin-window-state = "=2.5.0"
tauri-plugin-wdio = { version = "=1.5.0", optional = true }
tauri-plugin-wdio-webdriver = { version = "=1.5.0", optional = true }
url = "2"
uuid = { version = "1", features = ["v4", "serde"] }

tauri-plugin-lapis-terminal = { git = "https://github.com/lapismd/lapis-terminal", rev = "d7e0a7cd710fef626e1350c116ca6e4b18986972" }

tauri-plugin-lapis-ai = { git = "https://github.com/lapismd/lapis-ai", tag = "v0.2.0", version = "0.2.0" }
lapis-ai-app-tools = { git = "https://github.com/lapismd/lapis-ai", tag = "v0.2.0", version = "0.2.0" }
zeroize = "1"
axum = { version = "0.8", default-features = false, features = ["http1", "json", "tokio"] }

[target.'cfg(target_os = "macos")'.dependencies]
security-framework = "3.7"
mac-usernotifications = { version = "=0.3.1", default-features = false }
objc2 = "=0.6.5"
block2 = "=0.6.2"
objc2-app-kit = { version = "=0.3.2", default-features = false, features = ["NSWindow", "NSView", "NSButton", "NSWorkspace"] }
objc2-foundation = { version = "=0.3.2", default-features = false, features = ["NSGeometry", "NSNotification", "NSOperation", "NSString", "NSArray", "NSURL", "NSFileManager", "NSError", "block2"] }

[build-dependencies]
tauri-build = { version = "=2.7.3", features = [] }

[dev-dependencies]
rusqlite = { version = "0.37", features = ["bundled"] }

[profile.dev]
debug = 0

[profile.test]
debug = 0

[[bin]]
name = "lapis-acp-native-fixture"
path = "tests/fixtures/acp-provider.rs"
required-features = ["e2e"]
