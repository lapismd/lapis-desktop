[package]
name = "lapis-desktop"
version = "0.1.0"
edition = "2024"
rust-version = "1.99"
license = "Apache-2.0"
publish = false

[features]
default = []
custom-protocol = ["tauri/custom-protocol"]
e2e = ["dep:tauri-plugin-wdio", "dep:tauri-plugin-wdio-webdriver"]

[dependencies]
serde = { version = "1", features = ["derive"] }
tauri = { version = "=2.12.4", features = [] }
tauri-plugin-window-state = "=2.5.0"
tauri-plugin-wdio = { version = "=1.5.0", optional = true }
tauri-plugin-wdio-webdriver = { version = "=1.5.0", optional = true }
url = "2"

[build-dependencies]
tauri-build = { version = "=2.7.3", features = [] }

[dev-dependencies]
serde_json = "1"

[profile.dev]
debug = 0

[profile.test]
debug = 0
