name: CI

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

defaults:
  run:
    shell: bash

concurrency:
  group: lapis-desktop-ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  LAPIS_DESKTOP_VALIDATION_RUNTIME: native
  TURBO_API: ${{ vars.TURBO_API }}
  TURBO_TEAM: ${{ vars.TURBO_TEAM }}
  TURBO_TOKEN: ${{ secrets.TURBO_TOKEN }}
  TURBO_REMOTE_CACHE_SIGNATURE_KEY:
    ${{ secrets.TURBO_REMOTE_CACHE_SIGNATURE_KEY }}

jobs:
  governance:
    name: Governance
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - name: Check out the repository
        uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - name: Set up pnpm
        uses: pnpm/action-setup@v6
      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: pnpm
      - name: Install Jujutsu into the runner temp directory
        run: node scripts/validation/install-tools.mjs --ci
      - name: Check out pinned prerequisites
        run: node scripts/ci-siblings.mjs
      - name: Install mdBook
        uses: taiki-e/install-action@v2
        with:
          tool: mdbook@0.5.4
      - name: Initialize Jujutsu over the checked-out Git revision
        run: jj git init --colocate .
      - name: Select the actual pull-request or push revision range
        run: node scripts/ci-revisions.mjs
      - name: Build unpublished path packages
        run: node scripts/ci-prepare-links.mjs
      - name: Install dependencies
        run: node scripts/ci-install.mjs
      - name: Run governance checks
        run: node scripts/run-turbo.mjs ci:governance --summarize
      - name: Report Turbo cache
        run: node scripts/report-turbo-cache.mjs --github-summary

  quality:
    name: Quality
    runs-on: macos-15
    timeout-minutes: 45
    steps:
      - name: Check out the repository
        uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - name: Set up pnpm
        uses: pnpm/action-setup@v6
      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: pnpm
      - name: Install Jujutsu into the runner temp directory
        run: node scripts/validation/install-tools.mjs --ci
      - name: Check out pinned prerequisites
        run: node scripts/ci-siblings.mjs
      - name: Set up Rust
        uses: dtolnay/rust-toolchain@1.99.0
        with:
          components: clippy,rustfmt
      - name: Install mdBook
        uses: taiki-e/install-action@v2
        with:
          tool: mdbook@0.5.4
      - name: Initialize Jujutsu over the checked-out Git revision
        run: jj git init --colocate .
      - name: Select the actual pull-request or push revision range
        run: node scripts/ci-revisions.mjs
      - name: Build unpublished path packages
        run: node scripts/ci-prepare-links.mjs
      - name: Install dependencies
        run: node scripts/ci-install.mjs
      - name: Prepare the pinned native AI runtime
        run: pnpm ai:prepare -- --reuse
      - name: Run formatting, type, and source checks
        run: node scripts/run-turbo.mjs ci:quality --summarize
      - name: Report Turbo cache
        run: node scripts/report-turbo-cache.mjs --github-summary

  unit:
    name: Unit tests
    runs-on: macos-15
    timeout-minutes: 45
    steps:
      - name: Check out the repository
        uses: actions/checkout@v6
      - name: Set up pnpm
        uses: pnpm/action-setup@v6
      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: pnpm
      - name: Install Jujutsu into the runner temp directory
        run: node scripts/validation/install-tools.mjs --ci
      - name: Check out pinned prerequisites
        run: node scripts/ci-siblings.mjs
      - name: Set up Rust
        uses: dtolnay/rust-toolchain@1.99.0
        with:
          components: clippy,rustfmt
      - name: Build unpublished path packages
        run: node scripts/ci-prepare-links.mjs
      - name: Install dependencies
        run: node scripts/ci-install.mjs
      - name: Initialize Jujutsu over the checked-out Git revision
        run: jj git init --colocate .
      - name: Prepare the pinned native AI runtime
        run: pnpm ai:prepare -- --reuse
      - name: Run unit tests
        run: node scripts/run-turbo.mjs ci:unit --summarize
      - name: Report Turbo cache
        run: node scripts/report-turbo-cache.mjs --github-summary

  storybook-static:
    name: Static Storybook
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out the repository
        uses: actions/checkout@v6
      - name: Set up pnpm
        uses: pnpm/action-setup@v6
      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: pnpm
      - name: Install Jujutsu into the runner temp directory
        run: node scripts/validation/install-tools.mjs --ci
      - name: Check out pinned prerequisites
        run: node scripts/ci-siblings.mjs
      - name: Build unpublished path packages
        run: node scripts/ci-prepare-links.mjs
      - name: Install dependencies
        run: node scripts/ci-install.mjs
      - name: Build Storybook
        run: node scripts/run-turbo.mjs ci:storybook-static --summarize
      - name: Report Turbo cache
        run: node scripts/report-turbo-cache.mjs --github-summary

  storybook-interaction:
    name: Storybook interactions
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - name: Check out the repository
        uses: actions/checkout@v6
      - name: Set up pnpm
        uses: pnpm/action-setup@v6
      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: pnpm
      - name: Install Jujutsu into the runner temp directory
        run: node scripts/validation/install-tools.mjs --ci
      - name: Check out pinned prerequisites
        run: node scripts/ci-siblings.mjs
      - name: Build unpublished path packages
        run: node scripts/ci-prepare-links.mjs
      - name: Install dependencies
        run: node scripts/ci-install.mjs
      - name: Install Chromium
        run: pnpm exec playwright install --with-deps chromium
      - name: Run Storybook interaction and accessibility tests
        run: node scripts/run-turbo.mjs ci:storybook-interaction --summarize
      - name: Report Turbo cache
        run: node scripts/report-turbo-cache.mjs --github-summary

  bundle:
    name: Native bundle
    runs-on: macos-15
    timeout-minutes: 60
    steps:
      - name: Check out the repository
        uses: actions/checkout@v6
      - name: Set up pnpm
        uses: pnpm/action-setup@v6
      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: pnpm
      - name: Install Jujutsu into the runner temp directory
        run: node scripts/validation/install-tools.mjs --ci
      - name: Check out pinned prerequisites
        run: node scripts/ci-siblings.mjs
      - name: Set up Rust
        uses: dtolnay/rust-toolchain@1.99.0
        with:
          components: clippy,rustfmt
      - name: Build unpublished path packages
        run: node scripts/ci-prepare-links.mjs
      - name: Install dependencies
        run: node scripts/ci-install.mjs
      - name: Build, bundle, and audit the native app
        run: node scripts/run-turbo.mjs ci:bundle --summarize
      - name: Report Turbo cache
        run: node scripts/report-turbo-cache.mjs --github-summary

  headed:
    name: Native ARM64 acceptance
    runs-on: macos-15
    timeout-minutes: 60
    steps:
      - name: Check out the repository
        uses: actions/checkout@v6
      - name: Set up pnpm
        uses: pnpm/action-setup@v6
      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: pnpm
      - name: Install Jujutsu into the runner temp directory
        run: node scripts/validation/install-tools.mjs --ci
      - name: Check out pinned prerequisites
        run: node scripts/ci-siblings.mjs
      - name: Set up Rust
        uses: dtolnay/rust-toolchain@1.99.0
        with:
          components: clippy,rustfmt
      - name: Build unpublished path packages
        run: node scripts/ci-prepare-links.mjs
      - name: Install dependencies
        run: node scripts/ci-install.mjs
      - name: Prepare the pinned native AI runtime
        run: pnpm ai:prepare -- --reuse
      - name: Prepare verified native plugin fixtures
        run: node --import tsx scripts/ci-native-fixtures.mjs
      - name: Native ARM64 acceptance
        env:
          LAPIS_DESKTOP_PORTABLE_FIXTURES: .local/ci-native-plugins/manifest.json
        run: node scripts/run-turbo.mjs ci:headed --summarize
      - name: Report Turbo cache
        run: node scripts/report-turbo-cache.mjs --github-summary
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: native-acceptance
          path: .local/native-test/
          if-no-files-found: ignore

  linux:
    name: Native Linux (${{ matrix.target }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-24.04
            target: x86_64-unknown-linux-gnu
          - os: ubuntu-24.04-arm
            target: aarch64-unknown-linux-gnu
    steps:
      - name: Check out the repository
        uses: actions/checkout@v6
      - name: Set up pnpm
        uses: pnpm/action-setup@v6
      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: pnpm
      - name: Install Jujutsu into the runner temp directory
        run: node scripts/validation/install-tools.mjs --ci
      - name: Check out pinned prerequisites
        run: node scripts/ci-siblings.mjs
      - name: Install Linux WebKit build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev build-essential curl wget file libxdo-dev libssl-dev libayatana-appindicator3-dev librsvg2-dev patchelf
      - name: Set up Rust
        uses: dtolnay/rust-toolchain@1.99.0
        with:
          targets: ${{ matrix.target }}
          components: clippy,rustfmt
      - name: Build unpublished path packages
        run: node scripts/ci-prepare-links.mjs
      - name: Install dependencies
        run: node scripts/ci-install.mjs
      - name: Build the Linux release binary
        env:
          CARGO_BUILD_JOBS: "2"
        run: pnpm exec tauri build --target "${{ matrix.target }}" --no-bundle
      - uses: actions/upload-artifact@v7
        if: success()
        with:
          name: native-linux-${{ matrix.target }}
          path: src-tauri/target/${{ matrix.target }}/release/lapis-desktop
          if-no-files-found: error

  audit:
    name: Dependency audits
    needs:
      - governance
      - quality
      - unit
      - storybook-static
      - storybook-interaction
      - bundle
      - headed
      - linux
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - name: Check out the repository
        uses: actions/checkout@v6
      - name: Set up pnpm
        uses: pnpm/action-setup@v6
      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: pnpm
      - name: Install Jujutsu into the runner temp directory
        run: node scripts/validation/install-tools.mjs --ci
      - name: Check out pinned prerequisites
        run: node scripts/ci-siblings.mjs
      - name: Build unpublished path packages
        run: node scripts/ci-prepare-links.mjs
      - name: Install and audit the actual dependency projection
        run: node scripts/ci-install.mjs --audit

  validate:
    name: Validate
    if: always()
    needs:
      - governance
      - quality
      - unit
      - storybook-static
      - storybook-interaction
      - bundle
      - headed
      - linux
      - audit
    runs-on: ubuntu-latest
    steps:
      - name: Aggregate blocking validation lanes
        env:
          GOVERNANCE: ${{ needs.governance.result }}
          QUALITY: ${{ needs.quality.result }}
          UNIT: ${{ needs.unit.result }}
          STORYBOOK_STATIC: ${{ needs.storybook-static.result }}
          STORYBOOK_INTERACTION: ${{ needs.storybook-interaction.result }}
          BUNDLE: ${{ needs.bundle.result }}
          HEADED: ${{ needs.headed.result }}
          LINUX: ${{ needs.linux.result }}
          AUDIT: ${{ needs.audit.result }}
        run: |
          set -euo pipefail
          results=(
            "$GOVERNANCE"
            "$QUALITY"
            "$UNIT"
            "$STORYBOOK_STATIC"
            "$STORYBOOK_INTERACTION"
            "$BUNDLE"
            "$HEADED"
            "$LINUX"
            "$AUDIT"
          )
          for result in "${results[@]}"; do
            if [ "$result" != "success" ]; then
              echo "A required Lapis Desktop validation lane finished with: $result" >&2
              exit 1
            fi
          done
          echo "All blocking Lapis Desktop validation lanes passed."
