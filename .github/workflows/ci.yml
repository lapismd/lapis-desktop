          add-job-id-key: true
          key:
            desktop-v2-${{ runner.os }}-${{ runner.arch }}-backup-diagnostic-${{
            hashFiles('scripts/ci-sources.json') }}
          cache-workspace-crates: false
          cache-on-failure: true
          env-vars: CARGO CC CFLAGS CXX CMAKE RUST MACOSX_DEPLOYMENT_TARGET
      - name: Run the original case alone and its scoped integration group
        env:
          LAPIS_DESKTOP_RUST_BACKUP_DIAGNOSTIC: "1"
        run: node scripts/rust-backup-diagnostic.mjs
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: rust-backup-diagnostic-${{ github.run_attempt }}
          path: .local/native-test/rust-backup-diagnostic.json
          if-no-files-found: error
          retention-days: 14
