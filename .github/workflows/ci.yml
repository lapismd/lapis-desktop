          if-no-files-found: error
          retention-days: 7
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name:
            timing-dependency-packages-${{ strategy.job-index }}-${{
            github.run_attempt }}
          path: .local/ci-timing/
          include-hidden-files: true
          if-no-files-found: ignore
          retention-days: 7
    env:
      LAPIS_CI_PROFILE: ${{ needs.changes.outputs.profile }}
      LAPIS_DESKTOP_CI_PROFILE: ${{ needs.changes.outputs.profile }}
  prerequisites:
    name: Private prerequisites
    runs-on: ubuntu-24.04
