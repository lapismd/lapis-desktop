name: CI
on:
  pull_request: null
  push:
    branches:
      - main
  workflow_dispatch:
    inputs:
      full:
        description: Run all gates for exact-source release qualification
        type: boolean
        default: true
        required: false
permissions:
  contents: read
defaults:
  run:
    shell: bash
concurrency:
  group: lapis-desktop-ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true
env:
  LAPIS_DESKTOP_VALIDATION_RUNTIME: native
  TURBO_API: ${{ vars.TURBO_API }}
  TURBO_TEAM: ${{ vars.TURBO_TEAM }}
  TURBO_TOKEN: ${{ secrets.TURBO_TOKEN }}
  TURBO_REMOTE_CACHE_SIGNATURE_KEY:
    ${{ secrets.TURBO_REMOTE_CACHE_SIGNATURE_KEY }}
  CARGO_BUILD_JOBS: "2"
  LAPIS_CI_EVENT: ${{ github.event_name }}
  LAPIS_CI_PR_AUTHOR: ${{ github.event.pull_request.user.login }}
  LAPIS_CI_PR_AUTHOR_TYPE: ${{ github.event.pull_request.user.type }}
  LAPIS_CI_PR_HEAD: ${{ github.event.pull_request.head.ref }}
  LAPIS_DEPENDENCY_BOT_LOGIN: ${{ vars.LAPIS_DEPENDENCY_BOT_LOGIN }}

jobs:
  changes:
    name: Plan affected CI
    runs-on: ubuntu-24.04
    outputs:
      plan: ${{ steps.plan.outputs.plan }}
      full: ${{ steps.plan.outputs.full }}
      unit_groups: ${{ steps.plan.outputs.unit_groups }}
      quality_groups: ${{ steps.plan.outputs.quality_groups }}
      rust_packages: ${{ steps.plan.outputs.rust_packages }}
      rust: ${{ steps.plan.outputs.rust }}
      governance: ${{ steps.plan.outputs.governance }}
      quality: ${{ steps.plan.outputs.quality }}
      unit: ${{ steps.plan.outputs.unit }}
      storybook_static: ${{ steps.plan.outputs.storybook_static }}
      storybook_interaction: ${{ steps.plan.outputs.storybook_interaction }}
      bundle: ${{ steps.plan.outputs.bundle }}
      headed: ${{ steps.plan.outputs.headed }}
      linux: ${{ steps.plan.outputs.linux }}
      audit: ${{ steps.plan.outputs.audit }}
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v6
        with:
          node-version: 24
      - name: Check dependency-aware planning and aggregation
        run: node --test tests/governance/ci-selection.test.mjs
      - id: plan
        run: node scripts/ci/plan.mjs
      - uses: actions/upload-artifact@v7
        with:
          name: ci-plan
          path: .local/ci-plan.json
          include-hidden-files: true
  governance:
    name: Governance
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - name: Check out the repository
        uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: .github/ci-docs/pnpm-lock.yaml
      - name: Install Jujutsu into the runner temp directory
        run: node scripts/validation/install-tools.mjs --ci
      - name: Install mdBook
        uses: taiki-e/install-action@v2
        with:
          tool: mdbook@0.5.4
      - name: Initialize Jujutsu over the checked-out Git revision
        run: jj git init --colocate .
      - name: Select the actual pull-request or push revision range
        run: node scripts/ci-revisions.mjs
      - name: Install only published docs validation tools
        run: node scripts/ci/docs-setup.mjs
      - name: Validate documentation, specifications and immutable evidence
        run: node scripts/ci/docs.mjs
    needs:
      - changes
    if: needs.changes.outputs.governance == 'true'
  quality:
    name: Quality
    runs-on: macos-15
    timeout-minutes: 45
    steps:
      - name: Check out the repository
        uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - name: Set up pnpm
        uses: pnpm/action-setup@v6
      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: pnpm
      - name: Install Jujutsu into the runner temp directory
        run: node scripts/validation/install-tools.mjs --ci
      - name: Check out pinned prerequisites
        run: node scripts/ci-siblings.mjs
      - name: Set up Rust
        uses: dtolnay/rust-toolchain@1.99.0
        with:
          components: clippy,rustfmt
        if: needs.changes.outputs.rust == 'true'
      - name: Restore Rust dependency builds
        uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0
        with:
          workspaces: |-
            src-tauri -> target
            ../lapis-ai -> target
          shared-key: desktop-${{ runner.os }}-${{ runner.arch }}
          key:
            host-${{ hashFiles('scripts/ci-sources.json') }}-${{
            env.MACOSX_DEPLOYMENT_TARGET || 'system' }}
          cache-workspace-crates: false
          cache-on-failure: true
          env-vars: CARGO CC CFLAGS CXX CMAKE RUST
        if: needs.changes.outputs.rust == 'true'
      - name: Install mdBook
        uses: taiki-e/install-action@v2
        with:
          tool: mdbook@0.5.4
      - name: Initialize Jujutsu over the checked-out Git revision
        run: jj git init --colocate .
      - name: Select the actual pull-request or push revision range
        run: node scripts/ci-revisions.mjs
      - name: Build unpublished path packages
        run: node scripts/ci-prepare-links.mjs
      - name: Install dependencies
        run: node scripts/ci-install.mjs
      - name: Prepare the pinned native AI runtime
        run: pnpm ai:prepare -- --reuse
        if: needs.changes.outputs.rust == 'true'
      - name: Run formatting, type, and source checks
        run: node scripts/run-turbo.mjs ci:quality --summarize
      - name: Report Turbo cache
        run: node scripts/report-turbo-cache.mjs --github-summary
    needs:
      - changes
    if: needs.changes.outputs.quality == 'true'
    env:
      LAPIS_CI_RUST_PACKAGES: ${{ needs.changes.outputs.rust_packages }}
      LAPIS_CI_QUALITY_GROUPS: ${{ needs.changes.outputs.quality_groups }}
  unit:
    name: Unit tests
    runs-on: macos-15
    timeout-minutes: 45
    steps:
      - name: Check out the repository
        uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - name: Set up pnpm
        uses: pnpm/action-setup@v6
      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: pnpm
      - name: Install Jujutsu into the runner temp directory
        run: node scripts/validation/install-tools.mjs --ci
      - name: Check out pinned prerequisites
        run: node scripts/ci-siblings.mjs
      - name: Set up Rust
        uses: dtolnay/rust-toolchain@1.99.0
        with:
          components: clippy,rustfmt
        if: needs.changes.outputs.rust == 'true'
      - name: Restore Rust dependency builds
        uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0
        with:
          workspaces: |-
            src-tauri -> target
            ../lapis-ai -> target
          shared-key: desktop-${{ runner.os }}-${{ runner.arch }}
          key:
            host-${{ hashFiles('scripts/ci-sources.json') }}-${{
            env.MACOSX_DEPLOYMENT_TARGET || 'system' }}
          cache-workspace-crates: false
          cache-on-failure: true
          env-vars: CARGO CC CFLAGS CXX CMAKE RUST
        if: needs.changes.outputs.rust == 'true'
      - name: Build unpublished path packages
        run: node scripts/ci-prepare-links.mjs
      - name: Install dependencies
        run: node scripts/ci-install.mjs
      - name: Initialize Jujutsu over the checked-out Git revision
        run: jj git init --colocate .
      - name: Select the actual pull-request or push revision range
        run: node scripts/ci-revisions.mjs
      - name: Prepare the pinned native AI runtime
        run: pnpm ai:prepare -- --reuse
        if: needs.changes.outputs.rust == 'true'
      - name: Run unit tests
        run: node scripts/run-turbo.mjs ci:unit --summarize --log-order=stream
      - name: Report Turbo cache
        run: node scripts/report-turbo-cache.mjs --github-summary
    needs:
      - changes
    if: needs.changes.outputs.unit == 'true'
    env:
      LAPIS_CI_RUST_PACKAGES: ${{ needs.changes.outputs.rust_packages }}
      LAPIS_CI_UNIT_GROUPS: ${{ needs.changes.outputs.unit_groups }}
  storybook-static:
    name: Static Storybook
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out the repository
        uses: actions/checkout@v6
      - name: Set up pnpm
        uses: pnpm/action-setup@v6
      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: pnpm
      - name: Install Jujutsu into the runner temp directory
        run: node scripts/validation/install-tools.mjs --ci
      - name: Check out pinned prerequisites
        run: node scripts/ci-siblings.mjs
      - name: Build unpublished path packages
        run: node scripts/ci-prepare-links.mjs
      - name: Install dependencies
        run: node scripts/ci-install.mjs
      - name: Build Storybook
        run: node scripts/run-turbo.mjs ci:storybook-static --summarize
      - name: Report Turbo cache
        run: node scripts/report-turbo-cache.mjs --github-summary
    needs:
      - changes
    if: needs.changes.outputs.storybook_static == 'true'
  storybook-interaction-shards:
    name: Storybook interactions (shard ${{ matrix.shard }}/4)
    runs-on: ubuntu-latest
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        shard:
          - 1
          - 2
          - 3
          - 4
    env:
      LAPIS_DESKTOP_CATALOG_SHARD: ${{ matrix.shard }}
    steps:
      - name: Check out the repository
        uses: actions/checkout@v6
      - name: Set up pnpm
        uses: pnpm/action-setup@v6
      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: pnpm
      - name: Install Jujutsu into the runner temp directory
        run: node scripts/validation/install-tools.mjs --ci
      - name: Check out pinned prerequisites
        run: node scripts/ci-siblings.mjs
      - name: Build unpublished path packages
        run: node scripts/ci-prepare-links.mjs
      - name: Install dependencies
        run: node scripts/ci-install.mjs
      - name: Install Chromium
        run: pnpm exec playwright install --with-deps chromium
      - name: Run Storybook interaction and accessibility tests
        run:
          node scripts/run-turbo.mjs ci:storybook-interaction --summarize
          --log-order=stream
      - name: Report Turbo cache
        run: node scripts/report-turbo-cache.mjs --github-summary
    needs:
      - changes
    if: needs.changes.outputs.storybook_interaction == 'true'
  storybook-interaction:
    name: Storybook interactions
    if:
      always() && needs.changes.result == 'success' &&
      needs.changes.outputs.storybook_interaction == 'true'
    needs:
      - changes
      - storybook-interaction-shards
    runs-on: ubuntu-latest
    steps:
      - name: Require every catalog shard
        env:
          SHARDS: ${{ needs.storybook-interaction-shards.result }}
        run: test "$SHARDS" = success
  bundle:
    name: Native bundle
    runs-on: macos-15
    timeout-minutes: 60
    steps:
      - name: Check out the repository
        uses: actions/checkout@v6
      - name: Set up pnpm
        uses: pnpm/action-setup@v6
      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: pnpm
      - name: Install Jujutsu into the runner temp directory
        run: node scripts/validation/install-tools.mjs --ci
      - name: Check out pinned prerequisites
        run: node scripts/ci-siblings.mjs
      - name: Set up Rust
        uses: dtolnay/rust-toolchain@1.99.0
        with:
          components: clippy,rustfmt
      - name: Restore Rust dependency builds
        uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0
        with:
          workspaces: |-
            src-tauri -> target
            ../lapis-ai -> target
          shared-key: desktop-${{ runner.os }}-${{ runner.arch }}
          key:
            host-${{ hashFiles('scripts/ci-sources.json') }}-${{
            env.MACOSX_DEPLOYMENT_TARGET || 'system' }}
          cache-workspace-crates: false
          cache-on-failure: true
          env-vars: CARGO CC CFLAGS CXX CMAKE RUST
      - name: Build unpublished path packages
        run: node scripts/ci-prepare-links.mjs
      - name: Install dependencies
        run: node scripts/ci-install.mjs
      - name: Build, bundle, and audit the native app
        run: node scripts/run-turbo.mjs ci:bundle --summarize
      - name: Report Turbo cache
        run: node scripts/report-turbo-cache.mjs --github-summary
    needs:
      - changes
    if: needs.changes.outputs.bundle == 'true'
  headed:
    name: Native ARM64 acceptance
    runs-on: macos-15
    timeout-minutes: 60
    steps:
      - name: Check out the repository
        uses: actions/checkout@v6
      - name: Set up pnpm
        uses: pnpm/action-setup@v6
      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: pnpm
      - name: Install Jujutsu into the runner temp directory
        run: node scripts/validation/install-tools.mjs --ci
      - name: Check out pinned prerequisites
        run: node scripts/ci-siblings.mjs
      - name: Set up Rust
        uses: dtolnay/rust-toolchain@1.99.0
        with:
          components: clippy,rustfmt
      - name: Restore Rust dependency builds
        uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0
        with:
          workspaces: |-
            src-tauri -> target
            ../lapis-ai -> target
          shared-key: desktop-${{ runner.os }}-${{ runner.arch }}
          key:
            host-${{ hashFiles('scripts/ci-sources.json') }}-${{
            env.MACOSX_DEPLOYMENT_TARGET || 'system' }}
          cache-workspace-crates: false
          cache-on-failure: true
          env-vars: CARGO CC CFLAGS CXX CMAKE RUST
      - name: Build unpublished path packages
        run: node scripts/ci-prepare-links.mjs
      - name: Install dependencies
        run: node scripts/ci-install.mjs
      - name: Prepare the pinned native AI runtime
        run: pnpm ai:prepare -- --reuse
      - name: Prepare verified native plugin fixtures
        run: node --import tsx scripts/ci-native-fixtures.mjs
      - name: Native ARM64 acceptance
        env:
          LAPIS_DESKTOP_PORTABLE_FIXTURES: .local/ci-native-plugins/manifest.json
        run: node scripts/run-turbo.mjs ci:headed --summarize --log-order=stream
      - name: Report Turbo cache
        run: node scripts/report-turbo-cache.mjs --github-summary
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: native-acceptance
          path: .local/native-test/
          if-no-files-found: ignore
    needs:
      - changes
    if: needs.changes.outputs.headed == 'true'
  linux:
    name: Native Linux (${{ matrix.target }})
    runs-on:
      ${{ needs.changes.outputs.linux == 'true' && matrix.os || 'ubuntu-24.04'
      }}
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-24.04
            target: x86_64-unknown-linux-gnu
          - os: ubuntu-24.04-arm
            target: aarch64-unknown-linux-gnu
    steps:
      - name: Check out the repository
        uses: actions/checkout@v6
        if: needs.changes.outputs.linux == 'true'
      - name: Set up pnpm
        uses: pnpm/action-setup@v6
        if: needs.changes.outputs.linux == 'true'
      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: pnpm
        if: needs.changes.outputs.linux == 'true'
      - name: Install Jujutsu into the runner temp directory
        run: node scripts/validation/install-tools.mjs --ci
        if: needs.changes.outputs.linux == 'true'
      - name: Check out pinned prerequisites
        run: node scripts/ci-siblings.mjs
        if: needs.changes.outputs.linux == 'true'
      - name: Install Linux WebKit build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev build-essential curl wget file libxdo-dev libssl-dev libayatana-appindicator3-dev librsvg2-dev patchelf
        if: needs.changes.outputs.linux == 'true'
      - name: Set up Rust
        uses: dtolnay/rust-toolchain@1.99.0
        with:
          targets: ${{ matrix.target }}
          components: clippy,rustfmt
        if: needs.changes.outputs.linux == 'true'
      - name: Restore Rust dependency builds
        uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0
        with:
          workspaces: |-
            src-tauri -> target
            ../lapis-ai -> target
          shared-key: desktop-${{ runner.os }}-${{ runner.arch }}
          key:
            host-${{ hashFiles('scripts/ci-sources.json') }}-${{
            env.MACOSX_DEPLOYMENT_TARGET || 'system' }}
          cache-workspace-crates: false
          cache-on-failure: true
          env-vars: CARGO CC CFLAGS CXX CMAKE RUST
        if: needs.changes.outputs.linux == 'true'
      - name: Build unpublished path packages
        run: node scripts/ci-prepare-links.mjs
        if: needs.changes.outputs.linux == 'true'
      - name: Install dependencies
        run: node scripts/ci-install.mjs
        if: needs.changes.outputs.linux == 'true'
      - name: Build the Linux release binary
        env:
          CARGO_BUILD_JOBS: "2"
        run: pnpm exec tauri build --target "${{ matrix.target }}" --no-bundle
        if: needs.changes.outputs.linux == 'true'
      - uses: actions/upload-artifact@v7
        if: (success()) && needs.changes.outputs.linux == 'true'
        with:
          name: native-linux-${{ matrix.target }}
          path: src-tauri/target/${{ matrix.target }}/release/lapis-desktop
          if-no-files-found: error
      - name: Record unselected required Linux context
        if: needs.changes.outputs.linux != 'true'
        run:
          echo 'Linux build not selected; no native build or test was executed.'
          >> "$GITHUB_STEP_SUMMARY"
    needs:
      - changes
    if: always() && needs.changes.result == 'success'
  audit:
    name: Dependency audits
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - name: Check out the repository
        uses: actions/checkout@v6
      - name: Set up pnpm
        uses: pnpm/action-setup@v6
      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: pnpm
      - name: Install Jujutsu into the runner temp directory
        run: node scripts/validation/install-tools.mjs --ci
      - name: Check out pinned prerequisites
        run: node scripts/ci-siblings.mjs
      - name: Build unpublished path packages
        run: node scripts/ci-prepare-links.mjs
      - name: Install and audit the actual dependency projection
        run: node scripts/ci-install.mjs --audit
    needs:
      - changes
    if: needs.changes.outputs.audit == 'true'
  validate:
    name: Validate
    if: always()
    needs:
      - changes
      - governance
      - quality
      - unit
      - storybook-static
      - storybook-interaction
      - bundle
      - headed
      - linux
      - audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 24
      - name: Aggregate selected blocking validation lanes
        env:
          PLANNER_RESULT: ${{ needs.changes.result }}
          CI_PLAN: ${{ needs.changes.outputs.plan }}
          CI_RESULTS: ${{ toJSON(needs) }}
        run: node scripts/ci/validate-results.mjs
  qualification:
    name: Full source qualification
    needs:
      - changes
      - validate
    if:
      always() && needs.changes.result == 'success' &&
      needs.changes.outputs.full == 'true'
    runs-on: ubuntu-24.04
    steps:
      - name: Require every full qualification gate
        env:
          VALIDATE: ${{ needs.validate.result }}
        run: test "$VALIDATE" = success
