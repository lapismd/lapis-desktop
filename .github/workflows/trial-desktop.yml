name: Desktop trial build
on:
  workflow_dispatch:
permissions:
  contents: read
  actions: read
  packages: read
concurrency:
  group: desktop-trial-build-${{ github.ref }}
  cancel-in-progress: false
env:
  LAPIS_DESKTOP_VALIDATION_RUNTIME: native
  LAPIS_DESKTOP_TRIAL: "1"
jobs:
  ci-tools:
    name: Prepare verified CI tools
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    container:
      image: ghcr.io/lapismd/lapis-desktop-ci@sha256:789e6a92ae0ff217b195112ff2766bfaf6aa9a7f8d81021ebf3fce4976597927
      credentials:
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - name: Export image-owned cross-platform tools
        run: |
          git config --global --add safe.directory "$GITHUB_WORKSPACE"
          node scripts/ci/tool-artifact.mjs export \
            .local/ci-tools /opt/lapis-desktop-ci/tools
          tar -cf .local/tools.tar -C .local ci-tools
      - uses: actions/upload-artifact@v7
        with:
          name: ci-tools-${{ github.run_attempt }}
          path: .local/tools.tar
          if-no-files-found: error
          retention-days: 1
  build:
    name: Build trial app (${{ matrix.target }})
    needs: ci-tools
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-15
            target: aarch64-apple-darwin
          - os: ubuntu-24.04-arm
            target: aarch64-unknown-linux-gnu
          - os: ubuntu-24.04
            target: x86_64-unknown-linux-gnu
    runs-on: ${{ matrix.os }}
    timeout-minutes: 180
    env:
      LAPIS_NOTES_VALIDATION_RUNTIME: native
      LAPIS_AI_VALIDATION_RUNTIME: native
      CARGO_BUILD_JOBS: "2"
      RELEASE_TARGET: ${{ matrix.target }}
      GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.sha }}
      - uses: actions/setup-node@v6
        with:
          node-version: 24.15.0
      - uses: pnpm/action-setup@v6
      - uses: dtolnay/rust-toolchain@1.99.0
        with:
          targets: ${{ matrix.target }}
      - name: Free unused Linux runner disk
        if: runner.os == 'Linux'
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /usr/local/share/boost /usr/share/swift /opt/hostedtoolcache/CodeQL
          df -h /
      - name: Install Linux packaging prerequisites
        if: runner.os == 'Linux'
        run: >
          sudo apt-get update

          sudo apt-get install -y libwebkit2gtk-4.1-dev build-essential curl
          wget file libxdo-dev libssl-dev libayatana-appindicator3-dev
          librsvg2-dev patchelf desktop-file-utils
      - uses: ./.github/actions/setup-ci-tools
      - name: Prepare exact pinned source prerequisites
        run: node scripts/ci-siblings.mjs
      - name: Select configured macOS deployment minimum
        run: node scripts/native-build-environment.mjs --github-env
      - name: Restore Rust dependency builds
        uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0
        with:
          workspaces: |-
            src-tauri -> target
            ../lapis-ai -> target
          add-job-id-key: true
          key:
            desktop-v2-${{ runner.os }}-${{ runner.arch }}-trial-ordinary-${{
            matrix.target }}-${{ hashFiles('scripts/ci-sources.json') }}-${{
            env.MACOSX_DEPLOYMENT_TARGET || 'system' }}
          cache-workspace-crates: false
          cache-on-failure: true
          env-vars: CARGO CC CFLAGS CXX CMAKE RUST MACOSX_DEPLOYMENT_TARGET
      - name: Build private public exports
        run: node scripts/ci-prepare-links.mjs
      - name: Install and record verified private archives
        run: node scripts/ci-install.mjs --audit
      - name: Build ordinary trial app
        run: pnpm release:prepare
      - uses: actions/upload-artifact@v7
        with:
          name:
            desktop-trial-part-${{ matrix.target }}-${{ github.sha }}-${{
            github.run_attempt }}
          path: .local/release/parts/
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 7
  publish:
    name: Publish untested trial assets
    needs: build
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          pattern:
            desktop-trial-part-*-${{ github.sha }}-${{ github.run_attempt }}
          merge-multiple: true
          path: .local/release/parts
      - name: Publish the ordinary archives as an untested prerelease
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          tag="desktop-trial-${GITHUB_SHA}"
          notes=$(printf '%s\n' \
            "Untested ordinary build of ${GITHUB_SHA}." \
            "This is not a qualified preview and does not update Homebrew." \
            "The protected release workflow still requires a passing full CI run.")
          if gh release view "$tag" >/dev/null 2>&1; then
            gh release delete "$tag" --yes --cleanup-tag
          fi
          mapfile -t assets < <(find .local/release/parts -type f \( -name '*.zip' -o -name '*.tar.gz' \) | sort)
          test "${#assets[@]}" -eq 3
          gh release create "$tag" "${assets[@]}" \
            --prerelease \
            --title "Lapis Notes trial ${GITHUB_SHA:0:12}" \
            --notes "$notes"
