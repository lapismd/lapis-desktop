name: Publish Storybook to GitHub Pages

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  pages: write

defaults:
  run:
    shell: bash

concurrency:
  group: github-pages
  cancel-in-progress: true

env:
  LAPIS_DESKTOP_VALIDATION_RUNTIME: native

jobs:
  build:
    name: Build static Storybook
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Check out the default branch
        uses: actions/checkout@v6

      - name: Set up pnpm
        uses: pnpm/action-setup@v6

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: pnpm

      - name: Check out path dependencies
        run: node scripts/ci-siblings.mjs

      - name: Build unpublished path packages
        run: node scripts/ci-prepare-links.mjs

      - name: Install dependencies
        run: node scripts/ci-install.mjs

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v6
        with:
          enablement: true

      - name: Build static Storybook
        run: pnpm build-storybook

      - name: Verify complete static Storybook
        run: |
          test -f storybook-static/index.html
          test -f storybook-static/iframe.html
          test -f storybook-static/index.json

      - name: Upload GitHub Pages artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: storybook-static

  deploy:
    name: Deploy static Storybook
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    timeout-minutes: 10
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
