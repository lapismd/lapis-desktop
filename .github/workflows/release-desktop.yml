name: Desktop preview release
on:
  workflow_dispatch:
    inputs:
      operation:
        description:
          Prepare a candidate or recover a published release's tap update
        type: choice
        options:
          - prepare
          - publish-candidate
          - recover-tap
        default: prepare
      publish:
        description:
          Request protected publication approval after candidate qualification
        type: boolean
        default: false
      candidate_run_id:
        description: Successful preparation run ID to publish without rebuilding
        type: string
        required: false
      tag:
        description:
          Exact published desktop-v<CalVer>-rc.<N> tag for tap recovery
        type: string
        required: false
permissions:
  contents: read
  actions: read
concurrency:
  group: desktop-preview-release
  cancel-in-progress: false
env:
  HOMEBREW_TAP_REF: 5948fa8c25a135e79bb4a48e9186397b851db8a8
jobs:
  build:
    name: Build ordinary preview (${{ matrix.target }})
    if: github.ref == 'refs/heads/main' && inputs.operation == 'prepare'
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-15
            target: aarch64-apple-darwin
          - os: ubuntu-24.04-arm
            target: aarch64-unknown-linux-gnu
          - os: ubuntu-24.04
            target: x86_64-unknown-linux-gnu
    runs-on: ${{ matrix.os }}
    timeout-minutes: 180
    env:
      LAPIS_DESKTOP_VALIDATION_RUNTIME: native
      LAPIS_NOTES_VALIDATION_RUNTIME: native
      LAPIS_AI_VALIDATION_RUNTIME: native
      CARGO_BUILD_JOBS: "2"
      RELEASE_TARGET: ${{ matrix.target }}
      GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.sha }}
      - uses: actions/setup-node@v6
        with:
          node-version: 24.10.0
      - name: Require successful CI on this exact main source
        run: node scripts/release/gate.mjs
      - uses: pnpm/action-setup@v6
      - uses: dtolnay/rust-toolchain@1.99.0
        with:
          targets: ${{ matrix.target }}
      - name: Install Linux packaging prerequisites
        if: runner.os == 'Linux'
        run: >
          sudo apt-get update

          sudo apt-get install -y libwebkit2gtk-4.1-dev build-essential curl
          wget file libxdo-dev libssl-dev libayatana-appindicator3-dev
          librsvg2-dev patchelf desktop-file-utils
      - name: Install pinned Jujutsu tooling
        run: node scripts/validation/install-tools.mjs --ci
      - name: Prepare exact pinned source prerequisites
        run:
          node scripts/ci/timing.mjs run
          prepare-exact-pinned-source-prerequisites -- /bin/bash -e -o pipefail
          -c 'node scripts/ci-siblings.mjs'
      - name: Select configured macOS deployment minimum
        run: node scripts/native-build-environment.mjs --github-env
      - name: Start Rust cache timing
        run: node scripts/ci/timing.mjs start rust-cache
      - name: Restore Rust dependency builds
        id: rust-cache
        uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0
        with:
          workspaces: |-
            src-tauri -> target
            ../lapis-ai -> target
          add-job-id-key: true
          key:
            desktop-v2-${{ runner.os }}-${{ runner.arch }}-release-ordinary-${{
            matrix.target }}-${{ hashFiles('scripts/ci-sources.json') }}-${{
            env.MACOSX_DEPLOYMENT_TARGET || 'system' }}
          cache-workspace-crates: false
          cache-on-failure: true
          env-vars: CARGO CC CFLAGS CXX CMAKE RUST MACOSX_DEPLOYMENT_TARGET
      - name: Record effective Rust cache identity and restore duration
        if: always()
        env:
          TIMING_RESULT: ${{ steps.rust-cache.outcome }}
          CACHE_HIT: ${{ steps.rust-cache.outputs.cache-hit }}
          CACHE_IDENTITY:
            desktop-v2-${{ runner.os }}-${{ runner.arch }}-release-ordinary-${{
            matrix.target }}-${{ hashFiles('scripts/ci-sources.json') }}-${{
            env.MACOSX_DEPLOYMENT_TARGET || 'system' }}
        run: node scripts/ci/timing.mjs finish rust-cache
      - name: Build private public exports
        run:
          node scripts/ci/timing.mjs run build-private-public-exports --
          /bin/bash -e -o pipefail -c 'node scripts/ci-prepare-links.mjs'
      - name: Install and record verified private archives
        run:
          node scripts/ci/timing.mjs run
          install-and-record-verified-private-archives -- /bin/bash -e -o
          pipefail -c 'node scripts/ci-install.mjs --audit'
      - name: Build ordinary release app and helper inventory
        run:
          node scripts/ci/timing.mjs run
          build-ordinary-release-app-and-helper-inventory -- /bin/bash -e -o
          pipefail -c 'pnpm release:prepare'
      - uses: actions/upload-artifact@v7
        with:
          name:
            desktop-preview-part-${{ matrix.target }}-${{ github.sha }}-${{
            github.run_attempt }}
          path: .local/release/parts/
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 30
      - uses: actions/upload-artifact@v7
        if: failure()
        with:
          name:
            desktop-preview-build-failure-${{ matrix.target }}-${{ github.sha
            }}-${{ github.run_attempt }}
          path: .local/release/source-ci.json
          if-no-files-found: ignore
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: timing-build-${{ strategy.job-index }}-${{ github.run_attempt }}
          path: .local/ci-timing/
          include-hidden-files: true
          if-no-files-found: ignore
          retention-days: 7
  assemble:
    name: Assemble complete platform candidate
    needs: build
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.sha }}
      - uses: actions/setup-node@v6
        with:
          node-version: 24.10.0
      - uses: actions/download-artifact@v8
        with:
          pattern:
            desktop-preview-part-*-${{ github.sha }}-${{ github.run_attempt }}
          merge-multiple: true
          path: .local/release/parts
      - run: node scripts/release/assemble.mjs
      - uses: actions/upload-artifact@v7
        with:
          name:
            desktop-preview-assembled-${{ github.sha }}-${{ github.run_attempt
            }}
          path: .local/release/candidate/
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 30
  install:
    name: Qualify Homebrew preview (${{ matrix.target }})
    needs: assemble
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-15
            target: aarch64-apple-darwin
          - os: ubuntu-24.04-arm
            target: aarch64-unknown-linux-gnu
          - os: ubuntu-24.04
            target: x86_64-unknown-linux-gnu
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.sha }}
      - uses: actions/setup-node@v6
        with:
          node-version: 24.10.0
      - uses: actions/download-artifact@v8
        with:
          name:
            desktop-preview-assembled-${{ github.sha }}-${{ github.run_attempt
            }}
          path: .local/release/candidate
      - uses: actions/checkout@v6
        with:
          repository: lapismd/homebrew-tap
          ref: ${{ env.HOMEBREW_TAP_REF }}
          path: .local/release/tap
      - uses: actions/checkout@v6
        with:
          repository: lapismd/homebrew-tap
          ref: main
          path: .local/release/previous
      - uses: Homebrew/actions/setup-homebrew@f9676f1ffe2e1a720f81b2c54c51cfb99915ec14
      - name: Install Linux native window observation tools
        if: runner.os == 'Linux'
        run: >
          sudo apt-get update

          sudo apt-get install -y libwebkit2gtk-4.1-0 libgtk-3-0t64
          libayatana-appindicator3-1 xvfb dbus-x11 desktop-file-utils openbox
          wmctrl x11-utils
      - name: Install, launch and retain data through Homebrew operations
        env:
          RELEASE_TARGET: ${{ matrix.target }}
        shell: bash
        run: >
          archive=$(node --input-type=module -e 'import { readIdentity,
          archiveName } from "./scripts/release/contract.mjs";
          console.log(archiveName(readIdentity().version,
          process.env.RELEASE_TARGET));')

          command=(node .local/release/tap/scripts/test-preview-install.mjs
            --manifest .local/release/candidate/desktop-manifest.json
            --archive ".local/release/candidate/$archive"
            --source "$GITHUB_WORKSPACE"
            --previous-manifest
          .local/release/previous/desktop-preview-manifest.json
            --output ".local/release/homebrew/$RELEASE_TARGET")
          if [[ "$RUNNER_OS" == Linux ]]; then
            xvfb-run -a dbus-run-session -- "${command[@]}"
          else
            "${command[@]}"
          fi
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name:
            desktop-preview-receipts-${{ matrix.target }}-${{ github.sha }}-${{
            github.run_attempt }}
          path: .local/release/homebrew/
          include-hidden-files: true
          if-no-files-found: warn
          retention-days: 30
  candidate:
    name: Qualify Desktop preview candidate
    needs: install
    runs-on: ubuntu-24.04
    outputs:
      tag: ${{ steps.identity.outputs.tag }}
      artifact: ${{ steps.identity.outputs.artifact }}
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.sha }}
      - uses: actions/setup-node@v6
        with:
          node-version: 24.10.0
      - name: Record candidate identity
        id: identity
        run: |
          node --input-type=module <<'JS'
          import { appendFileSync } from 'node:fs';
          import { readIdentity } from './scripts/release/contract.mjs';
          const { tag } = readIdentity();
          appendFileSync(process.env.GITHUB_OUTPUT, `tag=${tag}\nartifact=desktop-preview-${process.env.GITHUB_SHA}-${process.env.GITHUB_RUN_ATTEMPT}\n`);
          JS
      - uses: actions/download-artifact@v8
        with:
          name:
            desktop-preview-assembled-${{ github.sha }}-${{ github.run_attempt
            }}
          path: .local/release/candidate
      - uses: actions/download-artifact@v8
        with:
          pattern:
            desktop-preview-receipts-*-${{ github.sha }}-${{ github.run_attempt
            }}
          merge-multiple: true
          path: .local/release/homebrew
      - name: Seal all three archives and native receipts
        run: node scripts/release/verify-candidate.mjs --seal
      - uses: actions/upload-artifact@v7
        with:
          name: ${{ steps.identity.outputs.artifact }}
          path: .local/release/candidate/
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 30
  select-candidate:
    name: Select previously qualified bytes
    if:
      github.ref == 'refs/heads/main' && inputs.operation == 'publish-candidate'
    runs-on: ubuntu-24.04
    outputs:
      run-id: ${{ steps.select.outputs.run-id }}
      artifact: ${{ steps.select.outputs.artifact }}
      tag: ${{ steps.select.outputs.tag }}
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.sha }}
      - uses: actions/setup-node@v6
        with:
          node-version: 24.10.0
      - id: select
        run: node scripts/release/select-candidate.mjs
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          CANDIDATE_RUN_ID: ${{ inputs.candidate_run_id }}
  publish:
    name: Approve and publish qualified preview
    needs:
      - candidate
      - select-candidate
    if: >-
      always() && inputs.publish == true && ((inputs.operation == 'prepare' &&
      needs.candidate.result == 'success') ||
       (inputs.operation == 'publish-candidate' && needs.select-candidate.result
      == 'success'))
    runs-on: ubuntu-24.04
    outputs:
      tag:
        ${{ needs.select-candidate.outputs.tag || needs.candidate.outputs.tag }}
    environment: desktop-preview-release
    permissions:
      contents: write
      actions: read
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.sha }}
      - uses: actions/setup-node@v6
        with:
          node-version: 24.10.0
      - uses: actions/download-artifact@v8
        with:
          name:
            ${{ needs.select-candidate.outputs.artifact ||
            needs.candidate.outputs.artifact }}
          run-id: ${{ needs.select-candidate.outputs.run-id || github.run_id }}
          github-token: ${{ secrets.GITHUB_TOKEN }}
          path: .local/release/candidate
      - name: Verify and publish the approved bytes without rebuilding
        run: node scripts/release/publish.mjs
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          LAPIS_DESKTOP_PUBLISH_APPROVED: "1"
  tap-update:
    name: Update Homebrew preview
    needs: publish
    if: always() && needs.publish.result == 'success'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6
        with:
          repository: lapismd/homebrew-tap
          ref: ${{ env.HOMEBREW_TAP_REF }}
      - uses: actions/setup-node@v6
        with:
          node-version: 24.10.0
      - name: Verify the published release and generate its preview cask
        run:
          node scripts/update-cask.mjs --channel preview --release
          "$RELEASE_TAG"
        env:
          RELEASE_TAG: ${{ needs.publish.outputs.tag }}
      - uses: actions/create-github-app-token@v2
        id: app
        with:
          app-id: ${{ vars.HOMEBREW_TAP_APP_ID }}
          private-key: ${{ secrets.HOMEBREW_TAP_APP_PRIVATE_KEY }}
          owner: lapismd
          repositories: homebrew-tap
          permission-contents: write
          permission-pull-requests: write
      - name: Open or recover the protected auto-merge PR
        run: node scripts/open-update-pr.mjs --channel preview
        env:
          GH_TOKEN: ${{ steps.app.outputs.token }}
  recover-tap:
    name: Recover published preview tap update
    if: github.ref == 'refs/heads/main' && inputs.operation == 'recover-tap'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6
        with:
          repository: lapismd/homebrew-tap
          ref: ${{ env.HOMEBREW_TAP_REF }}
      - uses: actions/setup-node@v6
        with:
          node-version: 24.10.0
      - name: Verify the existing public preview
        run:
          node scripts/update-cask.mjs --channel preview --release
          "$RELEASE_TAG"
        env:
          RELEASE_TAG: ${{ inputs.tag }}
      - uses: actions/create-github-app-token@v2
        id: app
        with:
          app-id: ${{ vars.HOMEBREW_TAP_APP_ID }}
          private-key: ${{ secrets.HOMEBREW_TAP_APP_PRIVATE_KEY }}
          owner: lapismd
          repositories: homebrew-tap
          permission-contents: write
          permission-pull-requests: write
      - name: Recover the update PR without republishing
        run: node scripts/open-update-pr.mjs --channel preview
        env:
          GH_TOKEN: ${{ steps.app.outputs.token }}
